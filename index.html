<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Google Search Box</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      margin: 0;
    }
    .search-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .search-input {
      width: 320px;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 16px;
    }
    .search-button {
      padding: 10px 14px;
      margin-left: 8px;
      border: none;
      background: #1a73e8;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .search-button:hover { background: #1669c1; }
    .visually-hidden {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script type='text/javascript'>
	  function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

			embeddedservice_bootstrap.init(
				'00DdL00000iJlgD',
				'GitHub_Pages',
				'https://sync-aforce-dev-ed.develop.my.site.com/ESWGitHubPages1767996348145',
				{
					scrt2URL: 'https://sync-aforce-dev-ed.develop.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://sync-aforce-dev-ed.develop.my.site.com/ESWGitHubPages1767996348145/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

  <div class="search-box">
    <form action="https://www.google.com/search" method="get" target="_blank" role="search" aria-label="Google Search">
      <label for="q" class="visually-hidden">Search Google</label>
      <input class="search-input" type="text" id="q" name="q" placeholder="Search Google" required />
      <button class="search-button" type="submit">Search</button>
    </form>
  </div>
</body>
</html>
